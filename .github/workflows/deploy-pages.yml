name: Deploy site (build + publish to gh-pages)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Clean up old artifacts (fix re-run duplicate artifact issue)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Delete any existing 'github-pages' artifact from previous attempts
          # to avoid the "Multiple artifacts named github-pages" error on re-runs
          artifacts_url="${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts"
          echo "Checking for existing github-pages artifacts in run ${{ github.run_id }}..."
          existing=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$artifacts_url" | \
            jq -r '.artifacts[] | select(.name == "github-pages") | .id')
          for id in $existing; do
            echo "Deleting old artifact ID: $id"
            curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "${{ github.api_url }}/repos/${{ github.repository }}/actions/artifacts/$id"
          done

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
